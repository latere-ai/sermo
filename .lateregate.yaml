# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only what is this repository's own
# is here.

license:
  spdx: Apache-2.0
  holder: Latere AI

spec:
  archive:
    dir: .archive
    statuses: [complete, superseded]
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  # No started list: status records a spec's own criteria; review holds the depends_on order.
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

# The identity shape of an open core (specs/003-identity-and-authorization.md):
# sermod verifies one token against the issuer it is given, hands every
# claim to the authorizer it asks, and reads none of them.
identity:
  role: core
  audience: sermo
  config_prefix: SERMO
  api_group: sermo
  # The audience is the default of a server somebody runs themselves; a
  # plane that fronts it verifies an audience of its own.
  reached_by: self-hosted
  # deploy/prod is Latere's own overlay inside the core's tree; it names the
  # installation it serves, so the no-latere-value rule reads the addresses
  # it sets and does not refuse them.
  skip:
    - deploy/prod
  overlays:
    - deploy/prod

# The store's migrations hold a session-scoped lock across their statements,
# which a transaction-mode pooler loses between transactions, so they run over
# the direct endpoint, SERMO_DATABASE_URL, and the serving path opens
# SERMO_DATABASE_POOL_URL where an installation names a pooled one.
postgres:
  role: pooled
  prefix: SERMO

# The server image is built, started and probed the way production runs it.
image:
  images:
    - name: sermod
      build_args:
        VERSION: v0.0.0-candidate
      version_args: [-version]
      version_expect: v0.0.0-candidate
      max_mib: 40
      # The memory store and an issuer that is never asked: the probes need
      # no token, and an issuer that does not answer at start is named and
      # the server starts, after reading its key set for up to 10 seconds,
      # which the 30 seconds below cover.
      env:
        SERMO_OIDC_ISSUERS: https://issuer.example.com
      port: 8080
      probe: /livez
      wait_seconds: 30
