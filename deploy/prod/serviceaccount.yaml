# The account the core runs as. It holds no token of the cluster's API,
# since sermod asks the cluster nothing, and pulls the private image with the
# namespace's pull secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sermod
  labels:
    app.kubernetes.io/name: sermod
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-secret
