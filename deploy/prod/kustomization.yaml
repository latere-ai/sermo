# The production target: the Sermo core as Latere runs it, behind the
# capability Messaging. It is declared in .lateregate.yaml under both
# identity.skip and identity.overlays, so the gate's no-latere-value rule
# reads the addresses set here rather than refusing them.
#
# Everything here is safe to re-apply, because the release pipeline applies
# it on every release with `kubectl apply -k deploy/prod` and then sets the
# image to the digest it built. A resource that cannot be re-applied belongs
# in deploy/bootstrap/, which the pipeline never reads.
#
# The Secrets sermo-db, sermod-authorizer, sermod-service-key and
# platformd-internal-ca are created outside the tree and keep their names.
# The ConfigMap is generated here, so a change of a setting renames it and
# rolls the Pods that read it.
#
# The manifests name the image with the placeholder `sermod`, which the
# images entry below resolves to the published image and the release this
# target runs. `lateregate release` rewrites the version in the same commit
# as the changelog section, under the release.stamp entry in
# .lateregate.yaml, so this line never lags a tag. The release's deploy job
# replaces the tag with the digest it built.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: latere
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml
images:
  - name: sermod
    newName: ghcr.io/latere-ai/sermod
    newTag: v0.2.0
configMapGenerator:
  - name: sermod
    envs:
      - sermod.env
