# The one rule sermod needs: /v1/messaging on your host, forwarded without a
# rewrite, because sermod writes that prefix in front of every route of its
# own. Fill in the host, the ingress class, and the TLS settings your
# cluster uses (a tls block, or an issuer annotation).
#
# The body limit is sermod's own, SERMO_MAX_REQUEST_BYTES, 8 MiB: a commit
# with its group info and ratchet tree for the largest group. A read of a
# conversation's messages waits at most 30 seconds for one, inside the
# controller's default read timeout of 60.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sermod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
spec:
  ingressClassName: nginx
  rules:
    - host: sermo.example.com
      http:
        paths:
          - path: /v1/messaging
            pathType: Prefix
            backend:
              service:
                name: sermod
                port:
                  name: public
