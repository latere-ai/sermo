# sermod, 2 replicas. The replicas hold no state of their own: every device
# record, key package, conversation, message and group state is a row of the
# database, so they are interchangeable and a rollout replaces them one at a
# time with none missing. A read that waits for a message ends when a
# replica stops, and the device reads again from another.
#
# Fill in: SERMO_OIDC_ISSUERS below, and the two Secrets this Deployment
# reads, created outside this tree.
#
# The database: SERMO_DATABASE_URL is the direct endpoint of the database,
# which sermod opens for its migrations at start, under the migrator's lock,
# and closes. SERMO_DATABASE_POOL_URL is the address serving opens, a
# transaction-mode pooler where you run one; with none, set it to the same
# address as the direct one. Both are keys of the Secret sermo-db. Each
# replica holds at most 4 pooled connections, so size the database's limit
# for the replicas plus one starting replica's migration.
#
# The server's key is a file: the Secret sermod-service-key mounted
# read-only, made once with `openssl rand -base64 32` and kept for the life
# of the database (docs/install.md, "The server's key").
#
# SERMO_AUTHORIZER_URL is unset, so the member policy decides. To use your
# own authorizer, set it in sermod.env, mount its bearer from a Secret and
# name the file in SERMO_AUTHORIZER_TOKEN_FILE (docs/authorizer.md).
#
# SERMO_INSTALLATION_KEY is unset, so the server admits no assistant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sermod
  labels:
    app.kubernetes.io/name: sermod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sermod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sermod
    spec:
      serviceAccountName: sermod
      automountServiceAccountToken: false
      # Above the preStop sleep, the 3 seconds sermod keeps answering after
      # a stop signal while readiness fails, and the 30 it then gives open
      # requests.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sermod
          # The placeholder never resolves; the kustomization's images entry
          # names the release this target runs.
          image: sermod
          envFrom:
            - configMapRef:
                name: sermod
          env:
            - name: SERMO_ADDR
              value: ":8080"
            # Fill in: the issuer whose tokens are accepted, and the
            # audience they name; `sermo` is the default.
            - name: SERMO_OIDC_ISSUERS
              value: https://issuer.example.com
            - name: SERMO_OIDC_AUDIENCE
              value: sermo
            - name: SERMO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sermo-db
                  key: SERMO_DATABASE_URL
            - name: SERMO_DATABASE_POOL_URL
              valueFrom:
                secretKeyRef:
                  name: sermo-db
                  key: SERMO_DATABASE_POOL_URL
          ports:
            - name: public
              containerPort: 8080
          # Separate on purpose: a database that does not answer takes the
          # Pod out of rotation and does not restart it. Readiness does not
          # read the authorizer, whose outage fails the requests that need
          # it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: public
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: public
            initialDelaySeconds: 10
            periodSeconds: 30
          # A Pod told to stop is still in the Service for the moment its
          # removal takes to reach every proxy; the kubelet's own sleep
          # keeps the listener open through it, since the image has no
          # shell and no sleep.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # The request is what a replica holds at rest; the limits bound a
          # burst of commits, each body at most 8 MiB.
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: service-key
              mountPath: /var/run/sermod-service-key
              readOnly: true
      volumes:
        - name: service-key
          secret:
            secretName: sermod-service-key
            items:
              - key: seed
                path: seed
