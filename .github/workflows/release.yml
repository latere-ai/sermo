# The release pipeline, on a v* tag, through latere-ai/ci's shared image
# release stages. The build stage requires that the tag's commit passed
# verify, checks the tag and its CHANGELOG section, builds sermod for
# linux/amd64 and linux/arm64, pushes it by digest and under no tag, checks
# the candidate reports the tag as its version, signs it, and writes its
# bill of materials. GitHub's attestations are skipped while the repository
# is private. Only then does the publish stage tag the digest, sign
# checksums.txt over the bill of materials, and publish the GitHub release
# with the CHANGELOG section as its body. The verify stage then checks the
# published release from a runner with no checkout, the way an installer
# would.
#
# The image namespace is the repository owner's, so a fork's tag publishes
# under the fork's. Each job is granted only what its stage needs. Every job
# runs on a hosted runner, as verify.yml's do, so the repository can turn
# public without moving a job.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@c3fcc1bda62305ca978a5474dd29a898564baa42
    # The stage declares attestations: write and a caller that grants less
    # fails before it starts, though it attests nothing in a private
    # repository.
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # sermod -version prints the tag it was stamped with and nothing else.
      image_1: '{"name": "sermod", "version_args": "-version", "version_expect": "{tag}"}'
      runs_on: ubuntu-latest

  publish:
    needs: build
    uses: latere-ai/ci/.github/workflows/image-publish.yml@c3fcc1bda62305ca978a5474dd29a898564baa42
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}
      runs_on: ubuntu-latest

  verify:
    needs: publish
    uses: latere-ai/ci/.github/workflows/release-verify.yml@c3fcc1bda62305ca978a5474dd29a898564baa42
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: sermod
      runs_on: ubuntu-latest
