name: Bug report
description: Something sermod does, or its docs say, that is wrong or missing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. See
        [SECURITY.md](https://github.com/latere-ai/sermo/blob/main/SECURITY.md)
        for how to report one privately.

        A question the docs do not answer is a bug in the docs: file it
        here, and say which page you read.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        A device sent a commit that adds a second person, and the answer was 422 refused with the detail ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The shortest sequence that shows it: the requests in order, with
        each answer's status and error code, or the client code that makes
        them. Redact tokens, and never paste a private key or a recovery
        key.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` that `GET /v1/messaging/version` answers, or `sermod -version` prints.
      placeholder: v0.2.0
    validations:
      required: true

  - type: dropdown
    id: store
    attributes:
      label: Store
      description: The `store=` of the line `sermod` prints when it starts.
      options:
        - Postgres
        - Postgres, serving through a pooler
        - Memory (no database)
    validations:
      required: true

  - type: dropdown
    id: decides
    attributes:
      label: Who decides
      description: The `authorizer=` of the line `sermod` prints when it starts.
      options:
        - An authorizer (remote)
        - The member policy
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client
      description: The client and its version, such as latere.ai/x/sdk-go v0.32.0, if a client is involved.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        The lines of sermod's log around the failure. They carry routes,
        error codes and details, never a message; redact hostnames you
        would rather not publish.
      render: text
