name: Feature request
description: Something Sermo should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What you are trying to do and where Sermo stops you: the kind of
        conversation, the client you are building, or the policy you want
        to hold it to. Describe the situation rather than the solution; the
        shape of a fix is easier to judge with the constraint in front of
        it.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: >
        Optional. How you would solve it, what you have ruled out, and
        anything it would let the server see that it does not see today.

  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: Optional. The workaround you are living with, if any.
